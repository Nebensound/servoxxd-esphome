name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Build unit tests
        run: |
          cd tests/unit
          make clean
          make all

      - name: Run unit tests
        run: |
          cd tests/unit
          make test

  esphome-compile:
    name: ESPHome Compile Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yaml-file:
          - tests/esphome/test_compile.yaml
          - tests/esphome/test_hardware.yaml
          - tests/esphome/test_valve_endstop.yaml
          - examples/basic_stepper.yaml
          - examples/advanced_positioning.yaml
          - examples/comprehensive_example.yaml
          - examples/multi_motor.yaml
          - examples/speed_mode.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Compile ${{ matrix.yaml-file }}
        run: |
          python tests/local_config.py compile "${{ matrix.yaml-file }}"

  configuration-tests:
    name: Configuration regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install esphome
      - run: python -m unittest discover -s tests -p 'test_*.py'

  format-check:
    name: Format Check (C++, Python, YAML)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install ruff
          npm install -g prettier

      - name: Check C++ Format
        run: |
          clang-format --dry-run --Werror components/servoxxd/stepper/*.cpp components/servoxxd/stepper/*.h tests/unit/test_*.cpp

      - name: Check Python Format
        run: |
          ruff format --check components/servoxxd/

      - name: Check YAML Format
        run: |
          prettier --check "**/*.{yaml,yml}"
