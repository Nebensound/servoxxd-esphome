name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Build unit tests
        run: |
          cd tests/unit
          make clean
          make all

      - name: Run unit tests
        run: |
          cd tests/unit
          make test

  esphome-compile:
    name: ESPHome Compile Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yaml-file:
          - tests/esphome/*.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Create secrets.yaml
        run: |
          cd tests/esphome
          cat > secrets.yaml << 'EOF'
          # ESPHome Secrets (CI Generated)
          # WiFi credentials
          wifi_ssid: "dummy_ci_ssid"
          wifi_password: "dummy_ci_password"

          # Fallback AP credentials
          fallback_ap_password: "test1234"
          EOF

      - name: Compile ${{ matrix.yaml-file }}
        run: |
          esphome compile ${{ matrix.yaml-file }}

  format-check:
    name: Format Check (C++, Python, YAML)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          pip install ruff
          npm install -g prettier

      - name: Check C++ Format
        run: |
          clang-format --dry-run --Werror components/servoxxd/stepper/*.cpp components/servoxxd/stepper/*.h tests/unit/test_*.cpp

      - name: Check Python Format
        run: |
          ruff format --check components/servoxxd/

      - name: Check YAML Format
        run: |
          prettier --check "**/*.{yaml,yml}"
