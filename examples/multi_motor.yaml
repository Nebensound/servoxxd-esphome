# Multi-Motor Servo42D RS485 Example
#
# This example shows how to control multiple motors on the same RS485 bus
# Each motor must have a unique MODBUS address configured via the display

esphome:
  name: servo42d-multi
  friendly_name: "Servo42D Multi-Motor Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Load component from GitHub
external_components:
  - source: github://Nebensound/servo42d-esphome
    components: [servo42d_rs485]

# Enable logging
logger:
  level: DEBUG

# Single UART for all motors on the same RS485 bus
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller (shared by all motors)
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# Multiple Servo42D motors with different addresses
stepper:
  # Motor 1 - X-Axis
  - platform: servo42d_rs485
    id: motor_x
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    servo_type: SERVO42D # Set per motor if different models are used
    max_speed: 2000 steps/s
    acceleration: 800 steps/s^2
    deceleration: 800 steps/s^2
    modbus_id: modbus_bus
    address: 0x01
    update_interval: 1s

  # Motor 2 - Y-Axis
  - platform: servo42d_rs485
    id: motor_y
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    servo_type: SERVO42D # SERVO28D | SERVO35D | SERVO42D | SERVO57D
    max_speed: 2000 steps/s
    acceleration: 800 steps/s^2
    deceleration: 800 steps/s^2
    modbus_id: modbus_bus
    address: 0x02
    update_interval: 1s

  # Motor 3 - Z-Axis
  - platform: servo42d_rs485
    id: motor_z
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    servo_type: SERVO42D
    max_speed: 1000 steps/s
    acceleration: 500 steps/s^2
    deceleration: 500 steps/s^2
    modbus_id: modbus_bus
    address: 0x03
    update_interval: 1s

# Example: Control buttons for each motor
button:
  - platform: template
    name: "Home X-Axis"
    on_press:
      - stepper.home: motor_x

  - platform: template
    name: "Home Y-Axis"
    on_press:
      - stepper.home: motor_y

  - platform: template
    name: "Home Z-Axis"
    on_press:
      - stepper.home: motor_z

  - platform: template
    name: "Home All Axes"
    on_press:
      - stepper.home: motor_x
      - delay: 5s # Wait for X to finish
      - stepper.home: motor_y
      - delay: 5s # Wait for Y to finish
      - stepper.home: motor_z
