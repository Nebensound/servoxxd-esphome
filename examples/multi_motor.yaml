# Multi-Motor ServoXXD RS485 Example
#
# This example shows how to control multiple motors on the same RS485 bus
# Each motor must have a unique MODBUS address configured via the display

esphome:
  name: servoxxd-multi
  friendly_name: "ServoXXD Multi-Motor Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Load the development branch; select an existing branch/tag for your deployment.
external_components:
  - source: github://Nebensound/servoxxd-esphome@develop
    components: [servoxxd]

# Enable logging
logger:
  level: DEBUG

# Single UART for all motors on the same RS485 bus
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller (shared by all motors)
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# Multiple Servo42D motors with different addresses
stepper:
  # Motor 1 - X-Axis
  - platform: servoxxd
    id: motor_x
    control_mode: SR_CLOSE
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    servo_type: SERVO42D # Set per motor if different models are used
    max_speed: 2000 steps/s
    acceleration: 800 steps/s^2
    modbus_id: modbus_bus
    address: 0x01
    # Each motor needs its own physical endstop wired to its controller.
    homing:
      mode: ENDSTOP
      direction: CW
      speed: 10 RPM
      endstop_trigger: HIGH
      at_startup: false

  # Motor 2 - Y-Axis
  - platform: servoxxd
    id: motor_y
    control_mode: SR_CLOSE
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    servo_type: SERVO42D # SERVO28D | SERVO35D | SERVO42D | SERVO57D
    max_speed: 2000 steps/s
    acceleration: 800 steps/s^2
    modbus_id: modbus_bus
    address: 0x02
    homing:
      mode: ENDSTOP
      direction: CW
      speed: 10 RPM
      endstop_trigger: HIGH
      at_startup: false

  # Motor 3 - Z-Axis
  - platform: servoxxd
    id: motor_z
    control_mode: SR_CLOSE
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    servo_type: SERVO42D
    max_speed: 1000 steps/s
    acceleration: 500 steps/s^2
    modbus_id: modbus_bus
    address: 0x03
    homing:
      mode: ENDSTOP
      direction: CW
      speed: 10 RPM
      endstop_trigger: HIGH
      at_startup: false

# Example: Control buttons for each motor
button:
  - platform: template
    name: "Home X-Axis"
    on_press:
      - stepper.home: motor_x

  - platform: template
    name: "Home Y-Axis"
    on_press:
      - stepper.home: motor_y

  - platform: template
    name: "Home Z-Axis"
    on_press:
      - stepper.home: motor_z

# Home axes individually and confirm completion in the logs before the next.
# A fixed delay does not guarantee completion or successful homing.
