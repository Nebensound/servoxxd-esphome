# Basic ServoXXD RS485 Stepper Motor Example
#
# This example shows the minimal configuration needed to control
# a MKS Servo42D/57D motor via RS485/MODBUS-RTU
#
# Hardware Setup:
# - ESP32 UART TX (GPIO17) -> RS485 DI (Data Input)
# - ESP32 UART RX (GPIO16) -> RS485 RO (Receiver Output)
# - RS485 A/B -> Motor A/B terminals
# - Motor must be pre-configured via display buttons:
#   * Mb_RTU menu option enabled
#   * Correct baud rate (38400 recommended)
#   * Motor address (default: 1)
#   * Work mode set to SR_VFOC (mode 5)

esphome:
  name: servoxxd-basic
  friendly_name: "ServoXXD Basic Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Use the checked-out component; see examples/README.md for standalone use.
external_components:
  - source:
      type: local
      path: ../components
    components: [servoxxd]

# Enable logging
logger:
  level: DEBUG

# UART for RS485 communication
# Adjust pins according to your hardware
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# Servo42D RS485 Stepper Motor
stepper:
  - platform: servoxxd
    id: my_stepper
    servo_type: SERVO42D
    control_mode: SR_VFOC
    microsteps: 1
    max_speed: 1000 steps/s
    acceleration: 500 steps/s^2

    # MODBUS configuration
    modbus_id: modbus_bus
    address: 0x01

# =============================================================================
# Example Buttons using Actions
# =============================================================================

button:
  # Basic motor control
  - platform: template
    name: "Enable Motor"
    on_press:
      - stepper.enable: my_stepper

  - platform: template
    name: "Disable Motor"
    on_press:
      - stepper.disable: my_stepper

  # Emergency functions
  - platform: template
    name: "Emergency Stop"
    on_press:
      - stepper.emergency_stop: my_stepper

  - platform: template
    name: "Release Protection"
    on_press:
      - stepper.release_protection: my_stepper

  # Calibration
  - platform: template
    name: "Calibrate Motor"
    on_press:
      - stepper.calibrate: my_stepper

# =============================================================================
# Example Script: Motor startup sequence
# =============================================================================

script:
  - id: motor_startup
    then:
      - logger.log: "Starting motor initialization..."
      - stepper.enable: my_stepper
      - delay: 500ms
      - stepper.calibrate: my_stepper
      - delay: 2s
      - logger.log: "Calibration requested; check motor state before moving."
