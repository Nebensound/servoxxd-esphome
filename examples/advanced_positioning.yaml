# Advanced ServoXXD RS485 Example with Home Assistant Integration
#
# This example demonstrates:
# - Position control with different modes
# - Homing/Zeroing functionality
# - Home Assistant integration
# - Status monitoring

esphome:
  name: servoxxd-advanced
  friendly_name: "ServoXXD Advanced Example"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Use the checked-out component; see examples/README.md for standalone use.
external_components:
  - source:
      type: local
      path: ../components
    components: [servoxxd]

# WiFi for Home Assistant integration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "ServoXXD Fallback"
    password: !secret fallback_ap_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# Enable logging
logger:
  level: DEBUG

# UART for RS485 communication
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  parity: EVEN
  stop_bits: 1

# MODBUS-RTU Controller
modbus:
  id: modbus_bus
  uart_id: uart_bus
  send_wait_time: 50ms

# Servo42D RS485 Stepper Motor
stepper:
  - platform: servoxxd
    id: my_stepper
    control_mode: SR_CLOSE
    mode: POSITION
    microsteps: 16 # 200 base steps × 16 = 3200 effective steps/rev
    # Select your motor model for proper current defaults/limits
    servo_type: SERVO42D # SERVO28D | SERVO35D | SERVO42D | SERVO57D
    max_speed: 3000 steps/s
    acceleration: 1000 steps/s^2

    # MODBUS configuration
    modbus_id: modbus_bus
    address: 0x01
    # Wire a physical endstop to the motor controller and match its polarity.
    homing:
      mode: ENDSTOP
      at_startup: false
      direction: CW
      speed: 10 RPM
      endstop_trigger: HIGH

# Example: Button to trigger homing sequence
button:
  - platform: template
    name: "Home Motor"
    on_press:
      - stepper.home: my_stepper

  - platform: template
    name: "Calibrate Motor"
    on_press:
      - stepper.calibrate: my_stepper

  - platform: template
    name: "Emergency Stop"
    on_press:
      - stepper.emergency_stop: my_stepper

  - platform: template
    name: "Release Protection"
    on_press:
      - stepper.release_protection: my_stepper

  - platform: template
    name: "Enable Motor"
    on_press:
      - stepper.enable: my_stepper

  - platform: template
    name: "Set High Current Mode"
    on_press:
      - stepper.set_working_current:
          id: my_stepper
          current: 2000

# Example: Number input for position control
number:
  - platform: template
    name: "Target Position"
    id: target_pos
    min_value: -100000
    max_value: 100000
    step: 100
    mode: box
    optimistic: true
    set_action:
      - stepper.set_target:
          id: my_stepper
          target: !lambda "return x;"

  - platform: template
    name: "Motor Speed"
    id: motor_speed
    min_value: 1
    max_value: 3000
    step: 10
    initial_value: 500
    mode: slider
    optimistic: true
    set_action:
      - stepper.set_speed:
          id: my_stepper
          speed: !lambda "return x;"

# Example: Sensor to display current position
sensor:
  - platform: template
    name: "Current Position"
    id: current_position
    unit_of_measurement: "steps"
    accuracy_decimals: 0
    lambda: "return id(my_stepper).current_position;"
    update_interval: 1s
